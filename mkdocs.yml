site_name: Installation recipes and end-to-end testing
site_description: Use reusable Contao recipes and test extensions, monorepos and web applications.
site_url: https://contao.github.io/setup-and-testing/
repo_url: https://github.com/contao/setup-and-testing
repo_name: contao/setup-and-testing
edit_uri: edit/main/docs/

theme:
    name: mkdocs
    custom_dir: docs-theme
    nav_style: light
    color_mode: auto
    user_color_mode_toggle: true
    highlightjs: true
    hljs_languages:
        - php
        - yaml
        - json
        - xml
        - powershell
        - bash

extra_css:
    - assets/contao.css

markdown_extensions:
    - md_in_html

plugins:
    - search

validation:
    nav:
        omitted_files: warn
        not_found: warn
        absolute_links: warn
    links:
        not_found: warn
        anchors: warn
        absolute_links: warn
        unrecognized_links: warn

nav:
    - Start here: index.md
    - Guides:
          - Test a Contao extension: guides/contao-extension.md
          - Test Contao packages in a monorepo: guides/monorepo.md
          - Test an existing Contao project: guides/contao-project.md
          - Test an existing web application: guides/web-application.md
          - Build a reusable recipe: guides/build-recipe.md
          - Apply a recipe: guides/apply-recipe.md
    - Recipes:
          - Dependencies, configuration and files: recipes/configuration.md
          - Database fixtures: recipes/fixtures.md
          - Portable archives: recipes/archives.md
          - Installation and runtime integration: recipes/installation.md
    - Testing:
          - Browsers and assertions: testing/browsers.md
          - Contao backend interactions: testing/backend.md
          - Frontend tests and origins: testing/frontend.md
          - Databases and isolation: testing/databases.md
          - Test-specific DCA: testing/dca.md
          - Custom PHPUnit base classes: testing/phpunit.md
          - Caching and maintenance: testing/caching.md
    - Run and debug:
          - GitHub Actions and CI caches: running/ci.md
          - Windows setup: running/windows.md
          - Playwright options: running/playwright.md
          - Debugging with traces: running/traces.md
          - Troubleshooting: running/troubleshooting.md
    - Reference:
          - Requirements: reference/requirements.md
          - Environment variables: reference/environment.md
          - CLI commands: reference/cli.md
    - Contributing: contributing.md
