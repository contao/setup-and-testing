name: CI

on:
    pull_request: ~
    push:
        branches:
            - main
            - '*.x'

permissions:
    contents: read

jobs:
    quality:
        name: Quality
        runs-on: ubuntu-latest
        steps:
            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: dom, intl, mbstring, pdo_mysql, zip
                  coverage: none

            - name: Checkout
              uses: actions/checkout@v6
              with:
                  show-progress: false
                  persist-credentials: false

            - name: Install the dependencies
              uses: ramsey/composer-install@v4

            - name: Install PHPStan
              uses: ramsey/composer-install@v4
              with:
                  working-directory: vendor-bin/phpstan

            - name: Install Rector
              uses: ramsey/composer-install@v4
              with:
                  working-directory: vendor-bin/rector

            - name: Install ECS
              uses: ramsey/composer-install@v4
              with:
                  working-directory: vendor-bin/ecs

            - name: Install the monorepo tools
              uses: ramsey/composer-install@v4
              with:
                  working-directory: vendor-bin/monorepo-tools

            - name: Validate Composer files
              run: |
                  composer validate --strict
                  composer validate --strict e2e-test-bundle/composer.json
                  composer validate --strict installation-recipe/composer.json
                  vendor-bin/monorepo-tools/vendor/bin/monorepo-tools composer-json --validate

            - name: Run the tests
              run: composer test

            - name: Run PHPStan
              run: composer phpstan

            - name: Run Rector
              run: vendor-bin/rector/vendor/bin/rector --dry-run --no-progress-bar

            - name: Run ECS
              run: vendor-bin/ecs/vendor/bin/ecs check --no-progress-bar

    phpunit:
        name: PHPUnit ${{ matrix.phpunit }}, Symfony ${{ matrix.symfony }} on PHP ${{ matrix.php }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - php: '8.2'
                      phpunit: '10.5'
                      symfony: '6.4'
                    - php: '8.4'
                      phpunit: '13.0'
                      symfony: '8.0'
        steps:
            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: dom, intl, mbstring, pdo_mysql, zip
                  coverage: none

            - name: Checkout
              uses: actions/checkout@v6
              with:
                  show-progress: false
                  persist-credentials: false

            - name: Select the PHPUnit and Symfony versions
              run: >-
                  composer require
                  phpunit/phpunit:^${{ matrix.phpunit }}
                  symfony/browser-kit:^${{ matrix.symfony }}
                  symfony/console:^${{ matrix.symfony }}
                  symfony/dependency-injection:^${{ matrix.symfony }}
                  symfony/dom-crawler:^${{ matrix.symfony }}
                  symfony/filesystem:^${{ matrix.symfony }}
                  symfony/http-client:^${{ matrix.symfony }}
                  symfony/http-kernel:^${{ matrix.symfony }}
                  symfony/panther:^2.1
                  symfony/process:^${{ matrix.symfony }}
                  symfony/yaml:^${{ matrix.symfony }}
                  --with-all-dependencies --no-interaction --no-progress

            - name: Run the tests
              run: composer test

    yamllint:
        name: YAMLlint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Run YAMLlint
              run: yamllint --format=github .
