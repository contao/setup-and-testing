name: CI

on:
    pull_request: ~
    push:
        branches:
            - main
            - '*.x'

permissions:
    contents: read

jobs:
    quality:
        name: Quality
        runs-on: ubuntu-latest
        steps:
            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: dom, intl, mbstring, pdo_mysql, pdo_sqlite, zip
                  coverage: none

            - name: Checkout
              uses: actions/checkout@v6
              with:
                  show-progress: false
                  persist-credentials: false

            - name: Install the dependencies
              uses: ramsey/composer-install@v4

            - name: Install PHPStan
              uses: ramsey/composer-install@v4
              with:
                  working-directory: vendor-bin/phpstan

            - name: Install Rector
              uses: ramsey/composer-install@v4
              with:
                  working-directory: vendor-bin/rector

            - name: Install ECS
              uses: ramsey/composer-install@v4
              with:
                  working-directory: vendor-bin/ecs

            - name: Install the monorepo tools
              uses: ramsey/composer-install@v4
              with:
                  working-directory: vendor-bin/monorepo-tools

            - name: Validate Composer files
              run: |
                  composer validate --strict
                  composer validate --strict e2e-test-bundle/composer.json
                  composer validate --strict installation-recipe/composer.json
                  vendor-bin/monorepo-tools/vendor/bin/monorepo-tools composer-json --validate

            - name: Run the tests
              run: composer test

            - name: Run PHPStan
              run: composer phpstan

            - name: Run Rector
              run: vendor-bin/rector/vendor/bin/rector --dry-run --no-progress-bar

            - name: Run ECS
              run: vendor-bin/ecs/vendor/bin/ecs check --no-progress-bar

    phpunit:
        name: PHPUnit ${{ matrix.phpunit }}, Symfony ${{ matrix.symfony }} on PHP ${{ matrix.php }} (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      php: '8.2'
                      phpunit: '10.5'
                      symfony: '6.4'
                    - os: ubuntu-latest
                      php: '8.4'
                      phpunit: '13.0'
                      symfony: '8.0'
                    - os: windows-latest
                      php: '8.4'
                      phpunit: '13.0'
                      symfony: '8.0'
        steps:
            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: dom, intl, mbstring, pdo_mysql, pdo_sqlite, zip
                  coverage: none

            - name: Checkout
              uses: actions/checkout@v6
              with:
                  show-progress: false
                  persist-credentials: false

            - name: Configure the PHPUnit and Symfony constraints
              shell: php {0}
              run: |
                  <?php

                  $composer = json_decode(file_get_contents('composer.json'), true, flags: JSON_THROW_ON_ERROR);
                  $composer['require']['phpunit/phpunit'] = '^${{ matrix.phpunit }}';

                  foreach ([
                      'symfony/browser-kit',
                      'symfony/console',
                      'symfony/dom-crawler',
                      'symfony/filesystem',
                      'symfony/http-client',
                      'symfony/process',
                      'symfony/yaml',
                  ] as $package) {
                      $composer['require'][$package] = '^${{ matrix.symfony }}';
                  }

                  file_put_contents('composer.json', json_encode($composer, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR)."\n");

            - name: Install the selected PHPUnit and Symfony versions
              run: >-
                  composer update
                  playwright-php/playwright
                  phpunit/phpunit
                  symfony/browser-kit
                  symfony/console
                  symfony/dom-crawler
                  symfony/filesystem
                  symfony/http-client
                  symfony/process
                  symfony/yaml
                  --with-all-dependencies --no-interaction --no-progress

            - name: Run the tests
              run: composer test

    yamllint:
        name: YAMLlint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Run YAMLlint
              run: yamllint --format=github .
